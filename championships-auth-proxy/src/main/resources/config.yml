api:
  base-url: http://cc-web:3000
  # cc-web BRIDGE_CLIENT_KEYS 中 role=AUTH_PROXY_READER 的独立密钥。
  key-id: proxy-a
  hmac-secret: change-me
  allow-insecure-private-http: true
  poll-seconds: 10
  connect-timeout-seconds: 3
  request-timeout-seconds: 5
