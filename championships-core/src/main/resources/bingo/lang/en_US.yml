mode:
  domination:
    name: "&aDomination"
    lore:
      - "&7Each cell is claimed by the first team"
      - "&7to finish it; others can't take it after."
      - "&7Make a line in your colour to win;"
      - "&7if no team can still make a line, it settles by most completed;"
      - "&7board full or timeout → most completed wins."
  speedrun:
    name: "&bSpeedrun"
    lore:
      - "&7Cells never lock, each team finishes its own."
      - "&7First team to make a line wins;"
      - "&7on timeout, most completed wins."
  quantity:
    name: "&6Quantity"
    lore:
      - "&7Cells never lock, each team finishes its own."
      - "&7Lines don't win — race for the most tasks:"
      - "&7first to finish the whole card wins;"
      - "&7on timeout, most completed wins."
  points:
    name: "&ePoints"
    lore:
      - "&7Cells never lock, each team finishes its own."
      - "&7Item pts by claim order, then floor value;"
      - "&7cell never locks (floor 30 for 4-7 teams, 20 for 8)."
      - "&7Line bonuses: first 4 lines +200, remaining +100."
      - "&7Highest total score at timeout wins (needs ≥4 teams)."
      - "&720-minute round."
  random:
    name: "&dRandom"
    lore:
      - "&7Picks one of the other modes"
      - "&7at random for this round."

