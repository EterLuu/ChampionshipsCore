mode:
  domination:
    name: "&a占据模式"
    lore:
      - "&7每个格子归最先完成的队伍占据，"
      - "&7此后其他队伍无法再完成该格。"
      - "&7率先用本队颜色连成一线者获胜；"
      - "&7若已无队伍能再连线，立即按完成数结算；"
      - "&7棋盘占满或时间到，则完成数多者胜。"
  speedrun:
    name: "&b速通模式"
    lore:
      - "&7格子不会被占据，各队可分别完成。"
      - "&7率先连成一线的队伍获胜；"
      - "&7时间到，则完成数多者胜。"
  quantity:
    name: "&6竞量模式"
    lore:
      - "&7格子不会被占据，各队可分别完成。"
      - "&7连线不计胜负，比拼完成数量："
      - "&7率先完成全部任务的队伍获胜；"
      - "&7时间到，则完成数多者胜。"
  points:
    name: "&e积分模式"
    lore:
      - "&7格子不会被占据，各队可分别完成。"
      - "&7按抢占顺序递减给分，之后均得底分，"
      - "&7格子不锁定（4-7队底分30，8队底分20）。"
      - "&7连线额外加分：前4条+200，其余+100。"
      - "&7时间到总分最高者胜（需≥4队）。"
      - "&7时长20分钟。"
  random:
    name: "&d随机模式"
    lore:
      - "&7从以上模式中随机抽取一个，"
      - "&7作为本局的游戏模式。"

