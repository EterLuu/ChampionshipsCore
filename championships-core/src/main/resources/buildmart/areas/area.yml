dont-edit-this:
  version: 17
name: "area"
world-name:
prepare:
  published: false
  dirty: true
  revision: 0
  published-at:
  world-built: false
countdown-block-disappearance:
  pos1:
  pos2:
  mode: RANDOM
# Round duration in seconds. Default 12 minutes.
timer: 720
# Preparation countdown before the round starts, in seconds.
prepare-time: 10
# Number of playable team bases stamped from the single base template. Copy 0 stays as the editable template;
# team bases occupy copies 1..N.
base-count: 8
# Filled by prepare from the resource-hub boundary and base.schem. The resource hub is hand-built in place and
# never saved or replayed as a schematic.
copy-layout:
  # Build Mart places the playable team bases in a chunk-aligned row; prepare fills the coordinates below.
  type: ROW
  # Legacy RING fields remain nullable so an old configuration is never relocated implicitly.
  center:
  source-origin:
  spacing:
  generated-origin:
  step:
  base-size:
# Legacy fields retained for old map files. Build Mart uses the resource-hub selection plus the stamped
# base template cuboids as its playable boundary; no single whole-map selection is required.
area-pos1:
area-pos2:
# Optional explicit spectator viewpoint; defaults to the hub portal point / world spawn when unset.
spectator-spawn-point:
# Hub bounding box. Inside it, flight is disabled and block placement is blocked.
hub-pos1:
hub-pos2:
# Landing point used when players enter a team-base Nether portal. Set this beside the resource-hub portal,
# not inside its purple portal block.
hub-portal-point:
# Optional wind vent cuboids. Non-gliding players above any selection are rapidly lifted toward absolute Y=200.
wind-zones: []
# Anchor where the current golden blueprint is pasted in the hub for players to observe.
golden-display-point:
# Portal debounce (ms) so players don't bounce back and forth after a manual cross-map teleport.
portal-cooldown-millis: 1000
# Single base TEMPLATE geometry (physical copy 0). It is never assigned to a team; every team uses copies 1..N,
# translated onto the chunk-aligned grid calculated by prepare. Configure all keys against copy 0.
# keys: portal, normal-plot-1..3, normal-ref-1..3, normal-submit-1..3,
#       golden-plot, golden-submit
# portal is the landing point reached from the resource-hub Nether portal; set it beside the portal, not inside it.
# Note: normal-submit-1..3 / golden-submit capture a WorldEdit SINGLE-BLOCK selection. normal-plot-1..3,
# normal-ref-1..3 and golden-plot capture an exact 7x1x7 floor selection and store its minimum corner.
# portal captures your standing position.
base: {}
# How often (seconds) the golden blueprint is swapped; it stays live for this whole window.
golden-refresh-seconds: 120

# 24 个材料岛的中心。材料区按水平距离自动归入最近的岛；新地图需先生成或填写完整中心。
material-islands: []

# 可选材料区。每项保存一个 WorldEdit 方块快照，比赛中每 2 分钟按选区原样恢复。
material-zones: []

# ── 规则介绍阶段（introduction）────────────────────────────
# 游戏正式开始前，玩家会先被传送到 introduction-spawn-point，在 45 秒内于聊天框分段播报下面的
# 规则文案（rules，每个子列表为一段，支持 & 颜色码与 &#RRGGBB 十六进制颜色），期间可以自由参观
# 场地；结束后传送到正式准备点位，读秒后开始游戏。
# introduction-spawn-point 留空时使用观战出生点；把 rules 设为 [] 可跳过该阶段。
introduction-spawn-point:
rules:
  - - "&#696969==========&r &#ff6b26[&e匹配赛建&#ff6b26] &#696969==========&r"
    - "&#fff566建筑师们，限时 12 分钟的速建大赛开工啦！"
    - "&#ededed一局定胜负，所有队伍同在一个世界"
    - "&#ededed各队基地有 3 个普通建筑区、1 个黄金建筑区"
    - "&#ededed和工具作业区，传送门通往共享的资源仓库"
    - "&#ededed去资源仓库采集方块，回建筑区复原蓝图建筑"
    - "&#ededed只能在采集区/建筑区破坏，只能在建筑区放置"
  - - "&#696969==========&r &#fff566积分规则 &#696969==========&r"
    - "&#ededed复原得分 = 难度星级 × 时段倍率："
    - "&#ededed0-4 分钟每星 &#fff56610 分&#ededed / 4-8 分钟 &#fff56615 分&#ededed / 8-12 分钟 &#fff56620 分"
    - "&#ededed最后 10 秒无法提交；未完建筑按比例给分"
    - "&#ededed数量最多/总星最多/平均星最高三项评比，"
    - "&#ededed前三队伍每人 &#fff566+25 / +15 / +5 分"
  - - "&#696969==========&r &#fff566小提示 &#696969==========&r"
    - "&#fff566普通蓝图 1-5 星随机刷新，交满才清空刷新"
    - "&#ededed黄金蓝图从 3 星建筑中抽取，完成按 7 星计分"
    - "&#ededed黄金提交需连点两次，失败直接清空重头来"
    - "&#ededed黄金蓝图每 2 分钟刷新，只认当前这一张"
    - "&#ededed材料不返还，采集前先规划好用量"
