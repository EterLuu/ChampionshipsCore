# ChampionshipsCore owns every sidebar shown by the event server. The file deliberately keeps the
# familiar SternalBoard colour syntax (& and #RRGGBB), but board selection is based on player state
# rather than world name. A rendered sidebar may contain at most 15 lines.
version: 1

settings:
  enabled: true
  update-interval-ticks: 20
  papi-fallback: true

values:
  map-publish:
    ready: "&a已发布"
    published: "&e有未发布修改"
    unpublished: "&c尚未发布"
    all-ready: "&a全部已发布"
    any-unpublished: "&e存在草稿或未保存修改"
  map-edit:
    world-invalid: "&c&l✗ 当前不在绑定世界，无法安全捕获配置"
    incomplete: "&c&l✗ 地图配置尚未完成"
    dirty: "#ff6b26&l⚠ 修改尚未发布，不能用于比赛"
    complete: "&a&l✓ 配置完整且已发布"
  game:
    role-spectator: "旁观"
    role-participant: "参赛"
    spectator: "&7旁观者"
  match:
    undecided: "&7待定"
  ranking:
    none: "&7暂无排行"
    bingo-daily-row: "{rank.team-color}{rank.position}. {rank.team} &7({rank.tasks} 项)"
    bingo-daily-own-row: "{rank.team-color}&l▶ {rank.position}. {rank.team} &7({rank.tasks} 项)"
  map-status:
    runtime-unknown: "&7未知"
  map-edit:
    world-unbound: "&c尚未绑定"
    world-correct: "&a正确"
    world-wrong: "&c错误"

style:
  title: '#3fb2ba[#31e061S#dbffe5³#e42d3eCC#bababa夏季联合锦标赛#3fb2ba]'
  separator: '#4f4f4f&m+-------------------+'
  footer: '&aHAMMER&f x &cRIA&f x &#ae70ffINF&f x &#036eb7&lHS'

boards:
  lobby:
    title: '{style.title}'
    lines:
      - '{style.separator}'
      - '#dfff2b轮次：#f6ffa8%schedule_round_total%/7'
      - '#ff0808下一轮积分加权：%schedule_round_points%'
      - ''
      - '&f队伍：{viewer.team}'
      - ''
      - '#4287f5个人积分：#ff6e26%cc_player_points%'
      - '#4287f5个人排名：#ff6e26%cc_player_rank%'
      - ''
      - '#ae70ff团队积分：&c%cc_player_team_points%'
      - '#ae70ff团队排名：&c%cc_player_team_rank%'
      - ''
      - '{style.footer}'

  daily-lobby:
    title: '{style.title}'
    lines:
      - '{style.separator}'
      - '#dfff2b当前游戏：#f6ffa8{daily.selected-game}'
      - '#ff0808当前状态：#ff7373{daily.queue-state}'
      - ''
      - '&f同行队长：#24abff{daily.party-leader}'
      - '&f同行人数：#ff6e26{daily.party-size}'
      - ''
      - '#4287f5等候人数：#ff6e26{daily.queue-players}'
      - '#4287f5启程倒计时：#ff6e26{daily.countdown}'
      - ''
      - '{style.footer}'

  map-status:
    title: '#64b5f6&l地图状态'
    lines:
      - '&7世界：&f{world.name}'
      - '&7关联地图：&f{map.count}'
      - '{map.entries}'
      - ''
      - '&7发布状态：{map.publish-status}'
      - '&7运行状态：{map.runtime-status}'
      - '&7Revision: &f{map.revision}'
      - ''
      - '#ff6b26&l⚠当前不是地图编辑模式'
      - '&7直接修改可能不会进入已发布模板'
      - '&7请使用&f /cc map edit <游戏>'

  map-edit:
    title: '#ffb74d&l地图编辑'
    lines:
      - '&7游戏：&f{edit.game}'
      - '&7地图：&f{edit.map}'
      - '&7世界：&f{edit.world}'
      - '&7当前位置：{edit.world-status}'
      - ''
      - '&7配置进度：{edit.progress-color}{edit.done}/{edit.total}'
      - '&7尚缺配置：{edit.error-color}{edit.errors}'
      - '&7发布状态：{edit.publish-status}'
      - '&7Revision: &f{edit.revision}'
      - ''
      - '{edit.warning}'
      - '&7使用热键栏完成配置、校验和发布'

  games:
    BattleBox:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373斗战方框'
        - '#dfff2b轮次：#f6ffa8%schedule_round_battlebox%/9'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f对阵：{match.right} &cvs {match.left}'
        - ''
        - '&f所选套装：#ff6e26%battlebox_player_kits_[areaName]%'
        - ''
        - '{style.footer}'

    ParkourTag:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373跑酷追击'
        - '#dfff2b轮次：#f6ffa8%schedule_round_parkourtag%/9'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f对阵：{match.right} &cvs {match.left}'
        - ''
        - '&f本轮角色：#ff6e26%parkourtag_player_role_[areaName]%'
        - ''
        - '{style.footer}'

    TNTRun:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373TNT飞跃'
        - '#dfff2b轮次：#f6ffa8%schedule_round_tntrun%/3'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - ''
        - '&f剩余存活玩家：#ff6e26%tntrun_area_survived_players_[areaName]%'
        - ''
        - '{style.footer}'

    SkyWars:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373空岛战争'
        - '#dfff2b轮次：#f6ffa8%schedule_round_skywars%/3'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f边界距离：&c%skywars_player_border_distance_[areaName]%'
        - ''
        - '&f剩余存活队伍：#ff6e26%skywars_area_survived_teams_[areaName]%'
        - '&f剩余存活玩家：#ff6e26%skywars_area_survived_players_[areaName]%'
        - ''
        - '{style.footer}'
      maps:
        area2:
          lines:
            - '#ff0808当前游戏：#ff7373空岛乱斗'
            - '#dfff2b轮次：#f6ffa8%schedule_round_skywars%/1'
            - ''
            - '#1da4ad场地状态：#f6ffa8{game.status}'
            - '&f边界距离：&c%skywars_player_border_distance_[areaName]%'
            - ''
            - '&f剩余存活队伍：#ff6e26%skywars_area_survived_teams_[areaName]%'
            - '&f剩余存活玩家：#ff6e26%skywars_area_survived_players_[areaName]%'
            - ''
            - '{style.footer}'

    HotyCodyDusky:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373烫手鳕鱼'
        - '#dfff2b轮次：#f6ffa8%schedule_round_hotycodydusky%/3'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f鳕鱼人：&c%hotycodydusky_area_cody_holder_[areaName]%'
        - ''
        - '&f剩余存活队伍：#ff6e26%hotycodydusky_area_survived_teams_[areaName]%'
        - '&f剩余存活玩家：#ff6e26%hotycodydusky_area_survived_players_[areaName]%'
        - ''
        - '{style.footer}'

    TGTTOS:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373去到另一边'
        - '#dfff2b轮次：#f6ffa8%schedule_round_tgttos%/6'
        - '&f本轮地图：&c%tgttos_area_name_[areaName]%'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - ''
        - '&f已抵达终点玩家数：#ff6e26%tgttos_area_player_arrived_[areaName]%'
        - '&f本队未抵达玩家数：#ff6e26%tgttos_player_team_not_arrived_[areaName]%'
        - ''
        - '{style.footer}'

    SnowballShowdown:
      title: '{style.title}'
      ranking-line: '{rank.team-color}{rank.position}. {rank.team} &f{rank.score}'
      own-ranking-line: '{rank.team-color}&l▶ {rank.position}. {rank.team} &f&l{rank.score}'
      lines:
        - '#ff0808当前游戏：#ff7373雪球大战'
        - '#dfff2b轮次：#f6ffa8%schedule_round_snowball%/3'
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f个人击杀：#ff6e26%snowball_player_individual_kills_[areaName]%'
        - '#4287f5乱斗总榜'
        - '{ranking}'
        - '{style.footer}'

    ParkourWarrior:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373跑路战士'
        - '#dfff2b轮次：#f6ffa8%schedule_round_parkourwarrior%/1'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '#4287f5达成关卡'
        - '&f主线：5-%parkourwarrior_player_total_main_checkpoints_[areaName]%'
        - '&f支线：1-%parkourwarrior_player_progress_sub_checkpoint_[areaName]_sub1%/2-%parkourwarrior_player_progress_sub_checkpoint_[areaName]_sub2%/3-%parkourwarrior_player_progress_sub_checkpoint_[areaName]_sub3%/4-%parkourwarrior_player_progress_sub_checkpoint_[areaName]_sub4%'
        - '#f6ffa82☆&f: %parkourwarrior_player_main_checkpoints_[areaName]%'
        - '#f6ffa83☆&f: %parkourwarrior_player_3rd_checkpoints_[areaName]%'
        - '#f6ffa84☆&f: %parkourwarrior_player_4th_checkpoints_[areaName]%'
        - '#f6ffa85☆&f: %parkourwarrior_player_5th_checkpoints_[areaName]%'
        - ''
        - '{style.footer}'

    DragonEggCarnival:
      title: '{style.title}'
      lines:
        - '&f最终对决：#f6ffa8龙蛋狂欢'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - ''
        - '%decarnival_area_team_[areaName]% &f: &c%decarnival_area_team_wins_[areaName]%&7/2'
        - '%decarnival_area_rival_[areaName]% &f: &c%decarnival_area_rival_wins_[areaName]%&7/2'
        - ''
        - '{style.footer}'

    Bingo:
      title: '{style.title}'
      ranking-line: '{rank.team-color}{rank.position}. {rank.team} &f{rank.score} &7({rank.tasks})'
      own-ranking-line: '{rank.team-color}&l▶ {rank.position}. {rank.team} &f&l{rank.score} &7({rank.tasks})'
      lines:
        - '#ff0808当前游戏：#ff7373宾果时速'
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f本队任务数：#ff6e26{viewer.tasks}'
        - '#4287f5总榜'
        - '{ranking}'
        - ''
        - '{style.footer}'

    BuildMart:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373匹配赛建'
        - '#dfff2b轮次：#f6ffa81/1'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f本队完成建筑：#ff6e26%buildmart_player_completed_builds_[areaName]%'
        - '&f本队累计星数：#ff6e26%buildmart_player_total_stars_[areaName]%'
        - ''
        - '&6黄金蓝图：&e%buildmart_area_golden_blueprint_[areaName]%'
        - ''
        - '{style.footer}'

    Dodgebolt:
      title: '{style.title}'
      lines:
        - '&f最终对决：#f6ffa8躲避箭'
        - '#dfff2b局数：#f6ffa8%dodgebolt_area_round_[areaName]%/5'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '%dodgebolt_area_right_team_[areaName]% &f: &c%dodgebolt_area_right_wins_[areaName]%&7局&f | &e%dodgebolt_area_right_alive_[areaName]%&7人'
        - '%dodgebolt_area_left_team_[areaName]% &f: &c%dodgebolt_area_left_wins_[areaName]%&7局&f | &e%dodgebolt_area_left_alive_[areaName]%&7人'
        - ''
        - '&f本局已射箭：#ff6e26%dodgebolt_area_shots_[areaName]%'
        - ''
        - '{style.footer}'

    AceRace:
      title: '{style.title}'
      lines:
        - '#ff0808当前游戏：#ff7373王牌竞速'
        - '#dfff2b轮次：#f6ffa81/1'
        - ''
        - '#1da4ad场地状态：#f6ffa8{game.status}'
        - '&f当前名次：#ff6e26%acerace_player_position_[areaName]%'
        - '&f当前圈数：#ff6e26%acerace_player_lap_[areaName]%'
        - '&f本圈检查点：#ff6e26%acerace_player_checkpoint_[areaName]%'
        - '#ff6e26%acerace_player_lap_times_[areaName]%'
        - '&f已完赛玩家：#ff6e26%acerace_area_finished_players_[areaName]%'
        - ''
        - '{style.footer}'
