name: ChampionshipsCore
version: '${project.version}'
main: ink.ziip.championshipscore.ChampionshipsCore
api-version: '26.3'
authors: [ Eter Lu, LettuceIce ]
depend:
  - packetevents
  - ProtocolLib
  - PlaceholderAPI
  - FastAsyncWorldEdit
commands:
  cc:
    description: Core command.
    usage: /<command>
permissions:
  cc.player:
    description: Player-facing ChampionshipsCore commands.
    default: false
  cc.admin:
    description: ChampionshipsCore event and administration commands.
    default: op
  cc.test:
    description: Resident Bot and manual test setup controls.
    default: false
  cc.test.automation:
    description: Automated Core test session controls for development and CI.
    default: false
  cc.refuge:
    description: ChampionshipsCore referee presentation and game-flow bypasses.
    default: false
