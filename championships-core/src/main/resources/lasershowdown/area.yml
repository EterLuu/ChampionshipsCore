# ──规则介绍阶段（introduction）────────────────────────────
#游戏正式开始前，玩家会先被传送到introduction-spawn-point，在45秒内于聊天框分段播报下面的
#规则文案（rules，每个子列表为一段，支持&颜色码与&#RRGGBB十六进制颜色），期间可以自由参观
#场地；结束后传送到正式准备点位，读秒后开始游戏。
# introduction-spawn-point留空时使用观战出生点；把rules设为[]可跳过该阶段。
introduction-spawn-point:
rules:
  - - "&#696969==========&r &#ff6b26[&6激光乱斗&#ff6b26] &#696969==========&r"
    - "&#fff566选择枪械，用激光击倒对手！"
    - "&#ededed五种枪械各有射程、弹道、弹匣和换弹节奏"
    - "&#ededed命中头部伤害更高，阵亡4秒后自动重生，重生保护持续4秒"
    - "&#ededed出生后8秒内用指南针换枪，开火或受伤立即锁定"
  - - "&#696969==========&r&#fff566积分规则&#696969==========&r"
    - "&#ededed每击杀一名对手：&#fff566+4分"
    - "&#ededed激光命中按头部、身体和腿部区域计算伤害"
    - "&#ededed按队伍击杀数排名：首档每人60分，每档递减5分，最低10分；同分同奖，零击杀队参与"
  - - "&#696969==========&r&#fff566小提示&#696969==========&r"
    - "&#fff566狙击枪右键瞄准，左键射击"
    - "&#ededed冲锋枪和机枪按住右键连续射击"
    - "&#ededed换手键开始换弹，换弹时切换枪械会中断"
    - "&#ededed移动、蹲下和连续射击会影响散布"
