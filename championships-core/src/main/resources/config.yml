dont-edit-this:
  version: 22
mode: "CHAMPIONSHIP"
# Registration names used by formal event schedules. These are map identities, not physical world names.
# Keep this section synchronized through /cc map rename; do not add map IDs in ScheduleManager code.
formal-events:
  Bingo:
    maps: [bingo]
  ParkourTag:
    maps: [towny]
  BattleBox:
    maps: []
  TNTRun:
    maps: [astra]
  SnowballShowdown:
    maps: [area1]
  SkyWars:
    maps: [area2]
  TGTTOS:
    maps: [cod, industry, badlands, tsf1, cliff, boat]
  DragonEggCarnival:
    maps: [area1]
  ParkourWarrior:
    maps: [TRI]
  HotyCodyDusky:
    maps: []
  BuildMart:
    maps: [area]
  Dodgebolt:
    maps: [dodgebolt]
  AceRace:
    maps: [clouds2]
# DAILY opens the self-service game menu and queues. It does not disable /cc event or /cc game start.
daily:
  enabled-games:
    - "Bingo"
    - "AceRace"
    - "DragonEggCarnival"
    - "ParkourWarrior"
  games:
    Bingo:
      min-players: 2
      max-players: 16
      team-size: 4
      teams: 4
      countdown-seconds: 60
    AceRace:
      min-players: 1
      max-players: 16
      team-size: 4
      teams: 4
      countdown-seconds: 60
      # Runtime copies share the same physical track and are isolated by player visibility.
      concurrent-instances: 2
    DragonEggCarnival:
      min-players: 2
      max-players: 8
      team-size: 4
      teams: 2
      countdown-seconds: 60
    ParkourWarrior:
      min-players: 1
      max-players: 16
      team-size: 4
      teams: 4
      countdown-seconds: 60
      # Runtime copies share the same physical course and are isolated by player visibility.
      concurrent-instances: 2
# Optional publisher for cc-web DAILY leaderboards. Use an AUTHBRIDGE_WRITER key.
leaderboard-sync:
  enabled: false
  base-url: "http://127.0.0.1:3000"
  key-id: "cc-core"
  hmac-secret: "change-me"
  allow-insecure-private-http: false
  interval-seconds: 300
  connect-timeout-seconds: 5
  request-timeout-seconds: 15
max-players: 100
whitelist: [ ]
# Only used when Core must resolve an offline player's name (for example, adding a team member).
# OFFLINE derives OfflinePlayer:<name> locally. PROFILE_UUID queries the configured standard
# /users/profiles/minecraft/<name> API and must return the UUID forwarded by the proxy at login.
# Core never replaces an online player's proxy/Bukkit UUID with either rule.
identity:
  mode: "OFFLINE"
  profile-api-base-url: "https://api.mojang.com"
  connect-timeout-seconds: 5
  request-timeout-seconds: 10
weighted-score: false
strict-spectator-rule: false
# 启用的游戏列表：只有列出的游戏会加载场地世界、可被指令操作并出现在 tab 补全中。
# 可选值: Bingo, ParkourTag, BattleBox, TNTRun, SnowballShowdown, SkyWars, TGTTOS,
#         DragonEggCarnival, ParkourWarrior, HotyCodyDusky, BuildMart, Dodgebolt, AceRace（大小写不敏感）
# 改为 [] 则不启用任何游戏。
enabled-games:
  - "Bingo"
  - "ParkourTag"
  - "BattleBox"
  - "TNTRun"
  - "SnowballShowdown"
  - "SkyWars"
  - "TGTTOS"
  - "DragonEggCarnival"
  - "ParkourWarrior"
  - "HotyCodyDusky"
  - "BuildMart"
  - "Dodgebolt"
  - "AceRace"
chat:
  # Player identity is rendered with the same [prefix] coloured-name contract as TAB.
  daily: "%s &#696969» &#ededed%s"
  refugee: "%s &#696969» &#ededed%s"
  player: "%s &#696969» &#ededed%s"
  spectator: "%s &#696969» &#ededed%s"
database:
  type: "MARIADB"
  address: "127.0.0.1"
  port: 3306
  name: "wcc"
  username: "root"
  password: "password"
# Shared infrastructure for database-cache synchronization and REMOTE Bingo.
# Every Core data directory gets a persistent ID when instance-id is "auto". Set an explicit unique
# value when instances share the same data directory or are cloned after first startup.
redis:
  enabled: false
  instance-id: "auto"
  uri: "redis://127.0.0.1:6379/0"
  namespace: "championships"
  consumer-group-prefix: "championships-core"
  stream-max-length: 100000
  block-timeout-ms: 2000
  reclaim-idle-ms: 15000
  max-deliveries: 8
  # Full DB reconciliation is the recovery path if publishing is interrupted at commit time.
  reconciliation-seconds: 30
team:
  max-members: 4
lobby:
  location:
    ==: org.bukkit.Location
    world: world
    x: 0.0
    y: 60.0
    z: 0.0
    pitch: 0.0
    yaw: 0.0
parkourtag:
  max-chaser-times: 4
bingo:
  # LOCAL keeps the current in-process game. REMOTE enables the dedicated Folia worker control plane.
  execution-mode: "LOCAL"
  worker-id: "bingo-1"
  worker-server: "bingo"
  proxy-channel: "BungeeCord"
  ready-timeout-seconds: 30
  arrival-timeout-seconds: 45
  # Running matches are aborted if the worker produces no ordered event or heartbeat in this window.
  heartbeat-timeout-seconds: 20
