rules:
  - - '&b霜冻狂潮：四张相同地图同时乱斗，每队每图1人，共四轮。'
    - '&f每轮150秒；命中敌人使其冻结，失温后重生，短暂保温抵挡冻结。'
  - - '&f每次有效击杀默认25分，四位队员的积分汇总到队伍。'
    - '&f冻结本身不计分；冰镐可直接击杀；保温期间免疫冻结与冰镐。'
  - - '&f走近金色补给领取道具，常规只持有一件；冰锥可换取两件。'
    - '&f营火：先放置，被冻后按F返回；凤凰余烬自动抵挡一次冻结。'
    - '&f暖流救援弩改为落点附近4秒内的一次自救。冻结会清空所持道具。'
