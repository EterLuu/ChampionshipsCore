    - "&#bff6ff&l霜冻决斗 &#bababa•&#ededed 游戏介绍"
    - "&#ededed共&#ff6b263轮&#ededed比赛，每轮四个场地同时乱斗，每队每个场地&#ff6b261人&#ededed。"
    - "&#ededed每轮&#ff6b263.5分钟&#ededed；命中敌人使其冻结，失温后重生，短暂保温可抵挡冻结。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#bff6ff&l霜冻决斗 &#bababa•&#ededed 积分规则"
    - "&#ededed每次有效击杀积&#ff6b266分&#ededed，冻结本身不计分；冰镐可直接击杀，保温期间免疫冻结与冰镐。"
    - "&#ededed每局按队伍击杀数排名：第一名队员每人&#ff6b2660分&#ededed，之后每名递减&#ff6b265分&#ededed至第11名每人&#ff6b2610分&#ededed，第12名起不加分。"
    - "&#ededed击杀数相同的队伍并列同分，后续名次按并列队伍数量跳位。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#bff6ff&l霜冻决斗 &#bababa•&#ededed 道具与冻结"
    - "&#ededed走近金色补给领取道具，常规只持有一件；冰锥可换取两件。补给效果在快捷栏上方显示&#ff6b265秒&#ededed。"
    - "&#ededed营火被冻后自动返回，凤凰余烬抵挡一次冻结；神秘补给箱随机给出道具，热能信标提供保温，冰霜陷阱冻结靠近的敌人。"
    - "&#ededed冻结会丢失道具，背包、护甲与副手变为冰块；重生及保温时进入着火状态。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
