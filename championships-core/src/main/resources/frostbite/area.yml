rules:
  - - '&b霜冻决斗（Frostbite Showdown）：三轮比赛，每轮四个场地同时乱斗，每队每场地1人。'
    - '&f每轮5分钟；命中敌人使其冻结，失温后重生，短暂保温抵挡冻结。'
  - - '&f每次有效击杀积6分，队员的积分汇总到队伍。'
    - '&f冻结本身不计分；冰镐可直接击杀；保温期间免疫冻结与冰镐。'
    - '&f每局按队伍击杀数排名：第一名队员每人加60分，之后每名递减5分至第11名每人10分，第12名起不加分。'
    - '&f击杀数相同的队伍并列同分，后续名次按并列队伍数量跳位。'
  - - '&f走近金色补给领取道具，常规只持有一件；冰锥可换取两件。'
    - '&f补给效果在快捷栏上方显示5秒；冰锥获得的两件道具依次显示。'
    - '&f营火：先放置，被冻后自动返回；凤凰余烬自动抵挡一次冻结。'
    - '&f神秘补给箱使用后随机获得一件道具；热能信标提供保温，冰霜陷阱冻结靠近的敌人。'
    - '&f冻结会丢失道具，背包、护甲与副手变为冰块；重生及保温时进入着火状态。'
