dont-edit-this:
  version: 28
name: "default"
world-name: ""
timer: 330
# Automatic: (.5,80,-110.5) to (.5,80,389.5), timer 330. Values are written when loaded/bound.
start-point: null
finish-point: null
# Runtime uses course.pool and a per-round immutable plan.
course:
  # Paired Sponge v3 snapshots. Building is relative to the actual finish; background to the start.
  # Empty preserves maps without a movable finish building. Both snapshots are required together.
  finish-platform:
    building: ""
    background: ""
  # Enable only after reserving the entire maximum-length corridor in the published map.
  layout:
    adaptive: false
    minimum-length: 500
    maximum-length: 650
    transition-seconds: 1.5
    clearance-blocks: 6
    time-reserve-seconds: 10
  hitw-catalog-version: 5
  wall-groups: true
  counts:
    pass: 12
    math: 5
    stopped: 8
    rhythm: 5
  stopped-allocation:
    mode: WEIGHTED
    weights:
      color-floor: 3
      dodge: 3
      side-sweep: 2
  preview-seed: 1
  # Empty means random each round; a signed integer reproduces a round under the same configuration.
  fixed-seed: ""
  # Omitting course.pool initializes a new map from built-in variants and riptiderush/hitw-walls.json.
  # Saved maps store their own independent course.pool snapshot on disk.
generation:
  raft-width: 7
  raft-length: 9
  obstacle-margin: 5
  clear-height: 12
  minimum-level-spacing: 14
  # Gameplay duration is derived from the acceleration stage.
  # Other total durations scale proportionally to ticks; rounding keeps durations non-increasing.
  raft-material: OAK_PLANKS
  obstacle-material: POLISHED_ANDESITE
movement:
  base-speed: 2.2
  # Acceleration occurs at 20%, 40%, 60%, 80%.
  # 5.2 blocks/s remains below a player's normal sprint speed (~5.6 blocks/s).
  final-speed: 5.2
  # Airborne edge margin; physical support uses the full player footprint.
  # Falls below the deck by >0.5 blocks, unsupported exits and liquid need 20 continuous ticks.
  horizontal-padding: 0.65
  fall-distance: 6.0
  # AIR for a void course; WATER also works for a course generated over water.
  trail-material: AIR
math:
  # Distance cap; per-player preview is additionally capped at four seconds of travel/display.
  preview-blocks: 18
  # Addition and non-negative subtraction operands; multiplication uses 10..99 and 2..9 in either order.
  minimum-operand: 1000
  maximum-operand: 9999
prepare:
  published: false
  dirty: true
  revision: 0
  published-at: null
  world-built: false
introduction-spawn-point: null
introduction-game-mode: ADVENTURE
countdown-block-disappearance:
  pos1: null
  pos2: null
  mode: RANDOM
rules:
  - - '&#696969==========&r &#ff6b26[&b激流勇进&#ff6b26] &#696969==========&r'
    - '&#ededed跟上木筏穿墙、答题、过节奏门；停船时完成踩色、躲避或侧向墙。'
    - '&#ededed开局一次护盾，40%航程时破碎；失误出局。正式赛3轮，每轮最多5分30秒。'
  - - '&#696969==========&r &#fff566积分规则 &#696969==========&r'
    - '&#ededed每有一人先于你出局，你获得&#fff5664分&#ededed。'
    - '&#ededed前三名额外获得&#fff566100/70/30分&#ededed；同时出局并列。'
