generation:
  raft-width: 7
  raft-length: 9
  obstacle-margin: 5
  clear-height: 12
  minimum-level-spacing: 14
  # Gameplay duration is derived from the acceleration stage.
  # Other total durations scale proportionally to ticks; rounding keeps durations non-increasing.
  raft-material: OAK_PLANKS
  obstacle-material: POLISHED_ANDESITE
movement:
  base-speed: 2.2
  # Acceleration occurs at 20%, 40%, 60%, 80%.
  # 5.2 blocks/s remains below a player's normal sprint speed (~5.6 blocks/s).
  final-speed: 5.2
  # Airborne edge margin; physical support uses the full player footprint.
  # Falls below the deck by >0.5 blocks, unsupported exits and liquid need 20 continuous ticks.
  horizontal-padding: 0.65
  fall-distance: 6.0
  # AIR for a void course; WATER also works for a course generated over water.
  trail-material: AIR
math:
  # Distance cap; per-player preview is additionally capped at four seconds of travel/display.
  preview-blocks: 18
  # Addition and non-negative subtraction operands; multiplication uses 10..99 and 2..9 in either order.
  minimum-operand: 1000
  maximum-operand: 9999
prepare:
  published: false
  dirty: true
  revision: 0
  published-at: null
  world-built: false
introduction-spawn-point: null
introduction-game-mode: ADVENTURE
countdown-block-disappearance:
  pos1: null
  pos2: null
  mode: RANDOM
rules:
  - - "&#ededed节奏门共26种：基础闸门、四种青色窗口，以及三拍脉冲、左-右-中接力、边缘换气、弹珠回弹、蛇形追拍、中心/边缘脉冲、折叠、分流合流、反拍留白、镜像追逐、斜线、双窗、后拍回收和急转弯拍。"
    - "&#ededed所有节奏门统一使用铁块墙体、红绿顶灯和音符提示；新增组合按四拍切换，每拍至少开放0.8秒。"
  - - "&#ededed所有关卡初始为统一尺寸的完整去皮云杉木墙，船头靠近至10格时显现原貌；侧墙关卡的占位木墙同时撤去，移动侧墙保持原貌。"
  - - "&#ededed解题包含算术和观察题：数颜色、左右找第几项、找最大最小、数奇偶、找唯一项；上行显示线索，下行显示问题和左右答案。"
  - - "&#ededed观察题随五段航程增加线索数量，后段使用相似两位数；找第几项的两个答案均来自数列。"
    - "&#ededed穿越墙体整场不重复，连续墙的通行位置错开；侧墙会推动身体碰到的玩家，及时换位穿洞避让。"
  - - "&#ededed节奏闸门：木筏持续前进，按开合节拍穿过，闭合会将墙内玩家挤出；基础七种与新增十五种组合均可抽取，离筏或掉落出局。"
  - - "&#696969━━━━━━━━ &#fff566&l激流勇进 &#696969━━━━━━━━"
    - "&#ededed每局随机编排赛道；请自行移动跟上木筏并穿过障碍，限时五分钟。"
  - - "&#ededed穿越、解题和节奏在第一次加速后开放双连续，第二次加速后开放三连续；留意下一面墙。"
    - "&#ededed第二次加速后可出现侧墙：穿越池随机建筑、每面来向独立随机；第三次加速后每组三面，沿用穿越的离筏与掉落判定。"
  - - "&#ededed加减法或两位数乘一位数，选择&#ff5555左侧红门&#ededed或&#55ffff右侧淡蓝门&#ededed；错误即出局。"
    - "&#ededed题目中央显示最多4秒，穿门即锁定答案；所有人从木筏中央出发，参赛时不显示其他玩家。"
  - - "&#ededed踩色五段依次32/28/24/20/16秒，方块种类依次5/6/7/8/8种；每关七轮。"
  - - "&#ededed躲避关木筏停留原地，固定9秒停船，前1秒提示；同一关固定一个来向，随后逐只随机刷新，碰撞即淘汰；提示显示前方、后方、左方、右方或上方，僵尸、骷髅、尸壳刷新高度降低一格。"
    - "&#ededed大字仅显示倒计时，动作栏仅显示目标方块；站到与背包及副手相同的方块上。"
    - "&#fff566离开木筏或坠落也会出局；存活到最后获胜。"
    - "&#ededed正式赛三轮独立计分；同批出局互不加分且并列排名，未出场不计分。"
  - - "&#ededed解题初始加法，一次加速加入减法与双连续，二次开放三连续，三次加入乘法。"
  - - "&#ededed护盾抵挡一关：踩色触发后本关后续踩错均免淘汰；解题和踩色错误不传送，掉出木筏才救回。"
  - - "&#ededed正向穿越难度：首次加速前仅1，首次后仅2，第二次后2或3。"
    - "&#ededed侧向门难度：第二次加速后仅1或2，第三次后仅2或3。"
    - "&#ededed穿越门和侧向门可能左右镜像，请观察本次洞口位置。"
  - - "&#ededed第四次加速后，穿越每关固定三扇；解题门与侧向门统一为三面侧向解题。"
    - "&#ededed木筏分为左红右淡蓝混凝土两区（中间一列为红色）；每面侧墙一道题，完全扫过时须在正确答案颜色方块上方。"
