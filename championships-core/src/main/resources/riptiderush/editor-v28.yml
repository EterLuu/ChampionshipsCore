course-editor:
  title: "激流勇进关卡编辑"
  steps:
    pass:
      title: "穿越关卡"
      lore: ["编辑穿越变体与每局数量"]
    math:
      title: "数学关卡"
      lore: ["编辑数学变体、每局数量与加减法范围"]
    floor:
      title: "踩色关卡"
      lore: ["编辑踩色变体、每局数量与停船时长"]
    course:
      title: "赛道设置与预览"
      lore: ["配置比赛限时、随机种子，生成或试玩赛道"]
      state:
        title: "限时 %value% 秒"
    category-state:
      title: "已启用 %count% 个变体 • 每局 %quota% 关"
  category:
    title: "%type%关卡 • 变体与设置"
  entry:
    title: "编辑变体 • %name%"
  add:
    title: "新增%type%变体 • 选择玩法"
  choice:
    title: "%name% • 选择属性"
  delete:
    title: "确认删除 • %name%"
  course:
    title: "激流勇进 • 赛道设置与预览"
  preview:
    title: "激流勇进 • 赛道预览"
  placement:
    title: "激流勇进 • 预览关卡"
  items:
    filler:
      title: "&#ededed "
      lore: []
      material: "GRAY_STAINED_GLASS_PANE"
    name:
      title: "&#ededed名称：%value%"
      lore: ["&#a0a0a0点击输入新名称"]
      material: "NAME_TAG"
    variant:
      title: "&#ededed玩法：%value%"
      lore: ["&#a0a0a0点击打开玩法列表", "&#a0a0a0选择具体玩法，或保留随机玩法"]
      material: "CRAFTING_TABLE"
    enabled:
      title: "&#ededed参与抽取"
      lore: ["&#a0a0a0点击切换；停用后保留全部设置"]
      material: "LIME_DYE"
      states:
        on:
          title: "&#55ff55已启用"
          material: "LIME_DYE"
        off:
          title: "&#aaaaaa已停用"
          material: "GRAY_DYE"
    weight:
      title: "&#ededed抽取权重：%value%"
      lore: ["&#a0a0a0点击输入1–100", "&#a0a0a0权重越高越容易抽中；重复抽中后权重递减"]
      material: "GOLD_NUGGET"
    max-uses:
      title: "&#ededed单局出现上限：%value%"
      lore: ["&#a0a0a0点击输入1–64", "&#a0a0a0限制本变体最多出现的次数，不保证一定出现"]
      material: "REPEATER"
    difficulty:
      title: "&#ededed难度：%value%"
      lore: ["&#a0a0a0点击选择难度1、2或3", "&#a0a0a0难度决定该变体可出现的赛段"]
      material: "EXPERIENCE_BOTTLE"
    duplicate:
      title: "&#ededed复制变体"
      lore: ["&#a0a0a0复制全部属性，打开新变体继续编辑"]
      material: "WRITABLE_BOOK"
    try-template:
      title: "&#ededed试玩此变体"
      lore: ["&#a0a0a0生成单关，3秒后开始，不计成绩", "&#a0a0a0自行跟上木筏；潜行退出并返回此页"]
      material: "FEATHER"
    delete:
      title: "&#ededed删除变体"
      lore: ["&#a0a0a0进入确认页；仅删除当前地图的这一项"]
      material: "BARRIER"
    option-auto:
      title: "&#ededed随机玩法"
      lore: ["&#a0a0a0从本类别的可用玩法中抽取", "&#a0a0a0点击选择"]
      material: "ENDER_EYE"
      states:
        selected:
          title: "&#55ff55随机玩法（当前）"
          glint: true
    option-gap:
      title: "&#ededed偏侧门洞"
      lore: ["&#a0a0a0穿过随机位于左侧或右侧的门洞", "&#a0a0a0点击选择"]
      material: "IRON_BARS"
      states:
        selected:
          title: "&#55ff55偏侧门洞（当前）"
          glint: true
    option-jump:
      title: "&#ededed单栏跳跃"
      lore: ["&#a0a0a0跳过横跨航线的低矮障碍", "&#a0a0a0点击选择"]
      material: "OAK_FENCE"
      states:
        selected:
          title: "&#55ff55单栏跳跃（当前）"
          glint: true
    option-weave:
      title: "&#ededed左右折返"
      lore: ["&#a0a0a0绕过两侧交错障碍；仅安排在中低速段", "&#a0a0a0点击选择"]
      material: "COBBLESTONE_WALL"
      states:
        selected:
          title: "&#55ff55左右折返（当前）"
          glint: true
    option-add:
      title: "&#ededed加法"
      lore: ["&#a0a0a0随机加法题；数字范围在数学类别页设置", "&#a0a0a0点击选择"]
      material: "RED_CONCRETE"
      states:
        selected:
          title: "&#55ff55加法（当前）"
          glint: true
    option-subtract:
      title: "&#ededed减法"
      lore: ["&#a0a0a0随机非负减法题；数字范围在数学类别页设置", "&#a0a0a0点击选择"]
      material: "BLUE_CONCRETE"
      states:
        selected:
          title: "&#55ff55减法（当前）"
          glint: true
    option-multiply:
      title: "&#ededed乘法"
      lore: ["&#a0a0a010–99与2–9相乘，两个数字顺序随机", "&#a0a0a0点击选择"]
      material: "PURPLE_CONCRETE"
      states:
        selected:
          title: "&#55ff55乘法（当前）"
          glint: true
    option-concrete:
      title: "&#ededed混凝土"
      lore: ["&#a0a0a0辨认不同颜色的混凝土", "&#a0a0a0点击选择"]
      material: "LIME_CONCRETE"
      states:
        selected:
          title: "&#55ff55混凝土（当前）"
          glint: true
    option-copper:
      title: "&#ededed铜材"
      lore: ["&#a0a0a0辨认不同状态的铜方块", "&#a0a0a0点击选择"]
      material: "COPPER_BLOCK"
      states:
        selected:
          title: "&#55ff55铜材（当前）"
          glint: true
    option-wood:
      title: "&#ededed木板"
      lore: ["&#a0a0a0辨认不同树种的木板", "&#a0a0a0点击选择"]
      material: "OAK_PLANKS"
      states:
        selected:
          title: "&#55ff55木板（当前）"
          glint: true
    option-terracotta:
      title: "&#ededed陶瓦"
      lore: ["&#a0a0a0辨认不同颜色的陶瓦", "&#a0a0a0点击选择"]
      material: "RED_TERRACOTTA"
      states:
        selected:
          title: "&#55ff55陶瓦（当前）"
          glint: true
    option-stone:
      title: "&#ededed石材"
      lore: ["&#a0a0a0辨认不同种类的石材", "&#a0a0a0点击选择"]
      material: "STONE"
      states:
        selected:
          title: "&#55ff55石材（当前）"
          glint: true
    difficulty-1:
      title: "&#ededed难度 1"
      lore: ["&#a0a0a0可安排在全程各段；开局仅使用难度1", "&#a0a0a0点击选择"]
      material: "EXPERIENCE_BOTTLE"
      states:
        selected:
          title: "&#55ff55难度 1（当前）"
          glint: true
    difficulty-2:
      title: "&#ededed难度 2"
      lore: ["&#a0a0a0航程25%之后可出现", "&#a0a0a0点击选择"]
      material: "EXPERIENCE_BOTTLE"
      states:
        selected:
          title: "&#55ff55难度 2（当前）"
          glint: true
    difficulty-3:
      title: "&#ededed难度 3"
      lore: ["&#a0a0a0航程65%之后可出现", "&#a0a0a0点击选择"]
      material: "EXPERIENCE_BOTTLE"
      states:
        selected:
          title: "&#55ff55难度 3（当前）"
          glint: true
    confirm-delete:
      title: "&#ededed确认删除"
      lore: ["&#a0a0a0删除后返回当前类别；不能撤销", "&#a0a0a0如只想暂停抽取，可返回并停用"]
      material: "RED_CONCRETE"
    cancel:
      title: "&#ededed取消"
      lore: ["&#a0a0a0保留变体，返回属性页"]
      material: "LIME_CONCRETE"
    course-summary:
      title: "&#ededed每局关卡组成"
      lore: ["&#a0a0a0穿越 %pass% 关 • 数学 %math% 关 • 踩色 %floor% 关", "&#a0a0a0各类数量与设置在对应类别页调整"]
      material: "BOOK"
    timer:
      title: "&#ededed比赛限时：%value% 秒"
      lore: ["&#a0a0a0点击输入1–3600", "&#a0a0a0完整航线必须能在限时内完成"]
      material: "CLOCK"
    preview:
      title: "&#ededed预览与试玩"
      lore: ["&#a0a0a0查看随机顺序、具体关卡和预计耗时", "&#a0a0a0可生成建筑，试玩单关或整条赛道"]
      material: "SPYGLASS"
    seed:
      title: "&#ededed预览种子：%value%"
      lore: ["&#a0a0a0点击输入整数种子", "&#a0a0a0相同配置与生成器版本可复现赛道"]
      material: "WHEAT_SEEDS"
    fixed:
      title: "&#ededed正式对局种子"
      lore: ["&#a0a0a0点击切换随机或锁定预览种子"]
      material: "TRIPWIRE_HOOK"
      states:
        random:
          title: "&#55ff55正式对局：每局随机"
          lore: ["&#a0a0a0点击锁定当前预览种子"]
        fixed:
          title: "&#fff566正式对局：锁定 %value%"
          lore: ["&#a0a0a0点击恢复每局随机", "&#696969修改预览种子不会改变已锁定的种子"]
          glint: true
    constraints:
      title: "&#ededed自动编排规则"
      lore: ["&#a0a0a0首尾安排穿越，数学和踩色之间隔开穿越", "&#a0a0a0相邻穿越玩法不同；踩色按区段分布", "&#a0a0a0按船速检查衔接，按实际移动规则检查耗时", "&#a0a0a0可先保存草稿；校验通过后才能发布"]
      material: "COMPARATOR"
    back:
      title: "&#ededed返回上一级"
      lore: []
      material: "ARROW"
    empty:
      title: "&#ededed尚无%type%变体"
      lore: ["&#a0a0a0点击下方“新增变体”开始创建", "&#a0a0a0已有变体和设置仅属于当前地图"]
      material: "GLASS_BOTTLE"
    quota:
      title: "&#ededed每局数量：%value%"
      lore: ["&#a0a0a0点击调整本类每场抽取的关卡数", "&#a0a0a0穿越至少2关；数学和踩色可设为0"]
      material: "COMPARATOR"
    minimum:
      title: "&#ededed加减法最小数字：%value%"
      lore: ["&#a0a0a0点击输入；不得大于最大数字", "&#a0a0a0乘法固定使用10–99与2–9"]
      material: "REDSTONE"
    maximum:
      title: "&#ededed加减法最大数字：%value%"
      lore: ["&#a0a0a0点击输入；不得小于最小数字", "&#a0a0a0此设置应用于本类全部加减法变体"]
      material: "GLOWSTONE_DUST"
    pause-seconds:
      title: "&#ededed每关停船时长：%value% 秒"
      lore: ["&#a0a0a0点击输入1–30；七轮按比例缩放", "&#a0a0a0应用于本类全部变体，木筏全程原地停留"]
      material: "CLOCK"
    add:
      title: "&#ededed新增%type%变体"
      lore: ["&#a0a0a0选择本类玩法，再编辑新变体的属性"]
      material: "EMERALD"
    category-summary:
      title: "&#ededed共 %count% 个变体 • 已启用 %enabled% 个"
      lore: ["&#a0a0a0上方点击变体进入属性页", "&#a0a0a0下方设置应用于本类别"]
      material: "BOOK"
    duration:
      title: "&#ededed预计全程：%value% 秒"
      lore: ["&#a0a0a0已包含全部踩色停船时间"]
      material: "CLOCK"
    invalid:
      title: "&#ededed当前配置无法编排"
      lore: ["&#a0a0a0%error%", "&#a0a0a0返回类别页调整变体或数量后再预览"]
      material: "BARRIER"
    reroll:
      title: "&#ededed换一条赛道"
      lore: ["&#a0a0a0更换预览种子并查看新的组合"]
      material: "SUNFLOWER"
    build:
      title: "&#ededed生成到地图"
      lore: ["&#a0a0a0分批生成当前预览赛道", "&#a0a0a0完成后进入地图查看；使用准备工具返回菜单"]
      material: "BRICKS"
    play:
      title: "&#ededed整条试玩"
      lore: ["&#a0a0a0生成当前预览赛道，3秒后开始", "&#a0a0a0不计成绩；潜行退出并返回预览页"]
      material: "FEATHER"
    seed-info:
      title: "&#ededed当前预览种子：%value%"
      lore: ["&#a0a0a0可在上一级“赛道设置与预览”中输入种子"]
      material: "WHEAT_SEEDS"
    inspect:
      title: "&#ededed生成并前往此关"
      lore: ["&#a0a0a0生成完整预览赛道，传送到本关上方查看", "&#a0a0a0使用准备工具重新打开编辑菜单"]
      material: "SPYGLASS"
    try-placement:
      title: "&#ededed试玩这一关"
      lore: ["&#a0a0a0使用预览中的玩法和位置进行单关试玩", "&#a0a0a03秒后开始；潜行退出并返回此页"]
      material: "FEATHER"
    busy:
      title: "&#ededed地图正在生成、试玩或比赛中，请结束后再编辑"
      lore: []
      material: "PAPER"
    expired:
      title: "&#ededed编辑会话已结束，请重新进入地图编辑"
      lore: []
      material: "PAPER"
    invalid-number:
      title: "&#ededed请输入有效的整数"
      lore: []
      material: "PAPER"
    range:
      title: "&#ededed请输入 %min%–%max% 之间的整数"
      lore: []
      material: "PAPER"
    edit-hint:
      title: "&#ededed点击编辑此变体"
      lore: []
      material: "PAPER"
    building:
      title: "&#ededed正在生成预览赛道，种子 %value%"
      lore: []
      material: "PAPER"
    build-failed:
      title: "&#ededed生成未完成，请检查地图配置后重试"
      lore: []
      material: "PAPER"
    built:
      title: "&#ededed赛道已生成，可使用准备工具返回编辑菜单"
      lore: []
      material: "PAPER"
    previous:
      title: "&#ededed上一页"
      lore: ["&#a0a0a0前往第 %page% / %pages% 页"]
      material: "ARROW"
    next:
      title: "&#ededed下一页"
      lore: ["&#a0a0a0前往第 %page% / %pages% 页"]
      material: "ARROW"
    entry:
      title: "&#ededed%name%"
      lore: ["&#a0a0a0类别：%type% • 玩法：%variant%", "&#a0a0a0难度 %difficulty% • 权重 %weight% • 单局上限 %max%", "&#a0a0a0%action%"]
      states:
        enabled:
          title: "&#55ffff%name%"
        disabled:
          title: "&#aaaaaa%name%（已停用）"
          material: "GRAY_DYE"
    placement:
      title: "&#ededed第 %number% 关 • %name%"
      lore: ["&#a0a0a0玩法：%variant% • 航程位置：%step% 格", "&#a0a0a0点击查看本关，选择查看建筑或单关试玩"]
