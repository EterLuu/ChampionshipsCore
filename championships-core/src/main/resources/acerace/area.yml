# 起点线、终点线和进度点都是 WE 水平底线及其向上延伸的垂直矩形门。
# 进度点选线不足 20 格时会以中心为准向两侧扩至 20 格，且选线下方 3 格也属于触发范围。
# 按通过顺序配置进度点；选手必须依次通过全部进度点后才能由终点线完成一圈。
# 起点线的 fall-y 负责第一进度点之前的赛段；每个进度点的 fall-y 负责通过该点后的赛段。
# 每个进度点的 equipment 可为 none、elytra 或 trident，负责该点到下一进度点之间的道具。
# 重生点按位置自动绑定到所在赛段，经过 3 格内时同步进度并保存位置；无需依赖列表顺序。
# 黄色带釉陶瓦：速度 III（4 秒）；黄绿色带釉陶瓦：跳跃提升 VII（2 秒）。
# 红色羊毛：行走进入 0.1 秒、从空中进入 0.2 秒后向当前朝向弹射；橙色羊毛同规则但更强力。
# 三叉戟为激流 I 且不可破坏；鞘翅不可破坏。通过新的进度点时自动发放或收回。
# 红色带釉陶瓦：2 格内获得速度 VIII 与海豚的恩惠（持续 1 秒）；水中获得潮涌之力与速度 III。
# 设置起点线时，当前位置同时作为起跑出生点；三类线均用 WorldEdit 选取水平直线。
