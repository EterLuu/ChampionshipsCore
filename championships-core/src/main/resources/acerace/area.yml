#起点线、终点线和进度点都是WE水平底线及其向上延伸的垂直矩形门。
#进度点选线不足20格时会以中心为准向两侧扩至20格，且选线下方3格也属于触发范围。
#按通过顺序配置进度点；选手必须依次通过全部进度点后才能由终点线完成一圈。
#起点线的fall-y负责第一进度点之前的赛段；每个进度点的fall-y负责通过该点后的赛段。
#每个进度点的equipment可为none、elytra或trident，负责该点到下一进度点之间的道具。
#重生点按位置自动绑定到所在赛段，经过3格内时同步进度并保存位置；无需依赖列表顺序。
#黄色带釉陶瓦：速度III（4秒）；黄绿色带釉陶瓦：跳跃提升VII（2秒）。
#红色羊毛：行走进入0.1秒、从空中进入0.2秒后向当前朝向弹射；橙色羊毛同规则但更强力。
#三叉戟为激流I且不可破坏；鞘翅不可破坏。通过新的进度点时自动发放或收回。
#红色带釉陶瓦：2格内获得速度VIII与海豚的恩惠（持续1秒）；水中获得潮涌之力与速度III。
#设置起点线时，当前位置同时作为起跑出生点；三类线均用WorldEdit选取水平直线。
