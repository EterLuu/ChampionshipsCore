rules:
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#fff566&l硫方足球 &#bababa•&#ededed 游戏介绍"
    - "&#ededed正式比赛前有 3 分钟试踢，不计分；正式比赛限时 12 分钟，先达到目标球数或时间结束时领先获胜。"
    - "&#ededed每队三人从中场均匀分布的点位出发，一人从球门前的独立白色标记上出发。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#fff566&l硫方足球 &#bababa•&#ededed 击球与防守"
    - "&#ededed空手击打吸收白桦木板的硫方怪推动足球，可以进入对方半场争球。"
    - "&#ededed禁止攻击玩家，也不能用桶、剪刀或其他物品改变足球。"
    - "&#ededed开局时末影珍珠即冷却 8 秒，此后每 8 秒可用一次；无落地伤害，球场外或高于地面 2 格的落点会被拒绝。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#fff566&l硫方足球 &#bababa•&#ededed 进球与开球"
    - "&#ededed足球中心进入对方门框内得一球；乌龙球计入对方比分。"
    - "&#ededed进球后双方回到出生点重新开球；足球出界则回中圈，不计分。"
    - "&#ededed选手掉线时比赛自动暂停，全部选手重连后继续。决赛进球不增加总榜积分。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  - - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "&#fff566&l硫方足球 &#bababa•&#ededed 点球大战"
    - "&#ededed12 分钟结束仍平局时，双方交替各射 4 球，每人轮流射门和守门；仍平局则按顺序继续各射一球直到分出胜负。"
    - "&#ededed射手被限制在离足球一格之外，只能攻击击球一次，不能接触推动足球；准备 3 秒后须在 15 秒内射门。"
    - "&#ededed守门员站在球门内不能击球，用快捷栏前三格的物品选择玻璃板挡左、中、右；点球期间不能使用珍珠。"
    - "&#696969━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
