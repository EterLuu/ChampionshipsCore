    - "&#ededed两队在竞技场中对战，每轮一场"
    - "&#ededed开局前点击木牌选择武器包："
    - "&#ededed武装！加速！治愈！拉扯！各司其职"
    - "&#ededed把&#fff566羊毛&#ededed填入中央目标区即可获胜"
