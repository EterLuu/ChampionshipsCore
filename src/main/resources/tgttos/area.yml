# ── 规则介绍阶段（introduction）────────────────────────────
# 游戏正式开始前，玩家会先被传送到 introduction-spawn-point，在 45 秒内于聊天框分段播报下面的
# 规则文案（rules，每个子列表为一段，支持 & 颜色码与 &#RRGGBB 十六进制颜色），期间可以自由参观
# 场地；结束后传送到正式准备点位，读秒后开始游戏。
# 将 introduction-spawn-point 留空或把 rules 设为 [] 即可跳过该阶段。
introduction-spawn-point:
rules:
  - - "&#696969==========&r &#ff6b26[&d去到另一边&#ff6b26] &#696969==========&r"
    - "&#fff566各就位——预备——冲呀！！"
    - "&#ededed所有人从起点出发，率先冲到终点"
    - "&#ededed部分地图会发放小船或挖掘工具"
    - "&#ededed跑酷、划船、挖路……各凭本事过关"
  - - "&#696969==========&r &#fff566积分规则 &#696969==========&r"
    - "&#ededed越早到达终点，得分越高（最多 &#fff56648 分&#ededed）"
    - "&#ededed率先到达者还有额外的名次奖励"
    - "&#ededed全队越早全部到达，团队加分越多"
  - - "&#696969==========&r &#fff566小提示 &#696969==========&r"
    - "&#fff566路线不止一条，观察对手但别盲从"
    - "&#ededed划船图把握好上下船的时机"
    - "&#ededed挖路图和队友分工，一人开路大家走"
