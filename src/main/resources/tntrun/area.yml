spectator-spawn-point:
# Aggregate play-area box for maps that do not define per-copy boxes. Prepared maps derive one tight box
# per copy from copy-size + the copy grid, so each sub-arena bounds its own players.
area-pos1:
area-pos2:
# Prepare/template model: use /cc map edit TNTRun to capture one arena schematic,
# configure its copy layout and publish the map. The saved selection minimum is copy 0's layout origin.
# Copy 0 remains the hand-built source; stamping only creates
# copies 1..N-1 in a row and records copies + copy-size below. Then stand in copy 0 and set
# copy-spawn. copies = how many arena copies players are split across; copy-spawn = the spawn inside copy 0;
# copy-size = one copy's block dimensions (auto-recorded, used to derive each copy's boundary box).
copies: 0
copy-size:
# Filled by prepare.
copy-layout: {}
copy-spawn:
# Optional explicit per-copy spawns. Leave empty when using copy-spawn + copies.
spawn-points: [ ]

# ── 规则介绍阶段（introduction）────────────────────────────
# 游戏正式开始前，玩家会先被传送到 introduction-spawn-point，在 45 秒内于聊天框分段播报下面的
# 规则文案（rules，每个子列表为一段，支持 & 颜色码与 &#RRGGBB 十六进制颜色），期间可以自由参观
# 场地；结束后传送到正式准备点位，读秒后开始游戏。
# introduction-spawn-point 留空时使用旁观出生点；把 rules 设为 [] 可跳过该阶段。
introduction-spawn-point:
rules:
