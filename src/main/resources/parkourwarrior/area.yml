# ── 规则介绍阶段（introduction）────────────────────────────
# 游戏正式开始前，玩家会先被传送到 introduction-spawn-point，在 45 秒内于聊天框分段播报下面的
# 规则文案（rules，每个子列表为一段，支持 & 颜色码与 &#RRGGBB 十六进制颜色），期间可以自由参观
# 场地；结束后传送到正式准备点位，读秒后开始游戏。
# 将 introduction-spawn-point 留空或把 rules 设为 [] 即可跳过该阶段。
introduction-spawn-point:
rules:
  - - "&#696969==========&r &#ff6b26[&d跑路战士&#ff6b26] &#696969==========&r"
    - "&#fff566热身完毕了吗？赛道已经恭候多时！"
    - "&#ededed在时限内挑战跑酷赛道，冲冲冲"
    - "&#ededed途经检查点会自动保存你的进度"
    - "&#ededed失误坠落会从最近的检查点重新开始"
    - "&#ededed后期进入&#ff6b26突然死亡模式&#ededed，坠落无法复活！"
  - - "&#696969==========&r &#fff566积分规则 &#696969==========&r"
    - "&#ededed按通过的关卡进度结算分数"
    - "&#ededed通过的检查点越多，得分越高"
    - "&#ededed尽力跑完全程，分数层层累加"
  - - "&#696969==========&r &#fff566小提示 &#696969==========&r"
    - "&#fff566稳住节奏，别在不熟的地方贪快"
    - "&#ededed右键回溯道具可返回支线选择点"
    - "&#ededed记住难点关卡的节奏，熟能生巧"
    - "&#ededed抬头观察路线标识，少走弯路"
