dont-edit-this:
  version: 1
name: "area"
# Round duration in seconds. Default 12 minutes.
timer: 720
# Preparation countdown before the round starts, in seconds.
prepare-time: 10
# Optional bounding box of the whole arena (hub + bases). Used for dropped-item cleanup.
area-pos1:
area-pos2:
# Optional explicit spectator viewpoint; defaults to the hub spawn / world spawn when unset.
spectator-spawn-point:
# Central resource-market spawn. Players returning from their base land here.
hub-spawn-point:
# Hub bounding box. Inside it, flight is disabled and block placement is blocked.
hub-pos1:
hub-pos2:
# Region inside the hub that returns a player to their own team base.
hub-return-pos1:
hub-return-pos2:
# Anchor where the current golden blueprint is pasted in the hub for players to observe.
golden-display-point:
# Portal debounce (ms) so players don't bounce back and forth across a portal region.
portal-cooldown-millis: 1000
# Single base TEMPLATE geometry (seat 0). Every team's base is a same-orientation copy of this template,
# translated onto a fixed grid (see BuildMartLayout). Stamp the map first with:
#   /cc game area buildmart prepare <area> <teams>
# then stand inside the seat-0 base (pasted at 0,100,500) and configure each key with:
#   /cc game area buildmart set <area> base <key>
# keys: spawn, portal-pos1, portal-pos2, normal-plot-1..3, normal-ref-1..3, golden-plot, golden-ref
base: {}
# How often (seconds) the normal blueprint library re-rolls its selectable list.
library-refresh-seconds: 90
# How often (seconds) the golden blueprint is swapped; it stays live for this whole window.
golden-refresh-seconds: 120
# How often (seconds) the hub resource zones are reset back to their template state.
resource-reset-seconds: 60
