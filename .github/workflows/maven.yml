name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: championships-test-harness/package-lock.json

    - name: Install Python formatter
      run: python3 -m pip install ruff==0.11.13

    - name: Check formatting, source ownership and documentation
      run: |
        bash scripts/format-java.sh --check
        ruff check scripts
        ruff format --check scripts
        python3 scripts/check-docs.py
        python3 scripts/check-source-layout.py
        python3 scripts/check-spectator-contract.py --strict

    - name: Test protocol harness
      working-directory: championships-test-harness
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm test

    - name: Build with Maven
      run: mvn -B -Dtest.redis.uri=redis://127.0.0.1:6379 clean package --file pom.xml

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        if-no-files-found: error
        path: |
          target/ChampionshipsCore-*.jar
          championships-bingo-worker/target/championships-bingo-worker-*.jar
          championships-auth-bridge/target/championships-auth-bridge-*.jar
          championships-auth-proxy/target/championships-auth-proxy-*.jar
