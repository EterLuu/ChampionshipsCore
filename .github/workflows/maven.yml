name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: championships-test-harness/package-lock.json

    - name: Install Python formatter
      run: python3 -m pip install ruff==0.11.13

    - name: Check formatting, source ownership and documentation
      run: |
        scripts/format-java.sh --check
        ruff format --check scripts
        python3 scripts/check-docs.py
        python3 scripts/check-source-layout.py
        python3 scripts/check-spectator-contract.py --strict

    - name: Test protocol harness
      working-directory: championships-test-harness
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm test

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
