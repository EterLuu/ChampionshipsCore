name: ChampionshipsBingoWorker
version: '${project.version}'
main: ink.ziip.championshipscore.worker.BingoWorkerPlugin
api-version: '26.1'
folia-supported: true
authors: [ Eter Lu, LettuceIce ]
description: Dedicated Folia execution worker for ChampionshipsCore Bingo matches.
softdepend:
  - PlaceholderAPI
commands:
  cc:
    description: Bingo match controls (free-play leave, admin stop).
    usage: /cc play leave | /cc game stop --confirm
permissions:
  cc.admin:
    description: Bingo worker administration (stop the live match).
    default: op
